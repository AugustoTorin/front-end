<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto HD</title>

    <!-- link favicon: coloca uma imagem no nome do site, junto ao title -->
    <link rel="shortcut icon" href="./images/shield-icon-black.svg" type="image/x-icon">

    <!-- dentro do link, no href ./ cria pastas e arquivos, no caso abaixo foi criada a pasta css e o arquico style.css -->
    <link rel="stylesheet" href="./css/style.css">
    
</head>
<body>
    <!-- nome da tag.(alguma coisa) já cria a tag com a classe -->
    <section class="hero">
        <header class="header-hero">
            <h1>Projeto HD</h1>
            <nav class="nav-hero">
                <ul class="nav-hero-menu">
                    <li><a href="">Home</a></li>
                    <li><a href="#galeria">Galeria</a></li>
                    <li><a href="#motos">Motos</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>
            </nav>
        </header>

        <div class="cta">
            <h2>Sonho em duas rodas</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Eum pariatur nam fugiat dignissimos?</p>
            <a href="" class="btn">Visite o site</a>
        </div>

    </section>

    <!-- tag*numero: cria várias tags iguais de uma vez. Para navegar entre secções, criar um id no sectione href da lista acima, precisa ter #nome_do_id -->
    <section id="galeria" class="galeria">
        <h2>Galeria</h2>
        <div class="grid-motos">
            <img src="./images/motos/pexels-angelo-capitanio-423939654-32172884.jpg" alt="Moto ABCD" loading="lazy">
            <img src="./images/motos/pexels-billingphotography-9509510.jpg" alt="Moto ABCD" loading="lazy">
            <img src="./images/motos/pexels-dantemunozphoto-31439827.jpg" alt="Moto ABCD" loading="lazy">
            <img src="./images/motos/pexels-labskiii-15433613.jpg" alt="Moto ABCD" loading="lazy">
            <img src="./images/motos/pexels-labskiii-31813660.jpg" alt="Moto ABCD" loading="lazy">
            <img src="./images/motos/pexels-olegprachuk-7969635.jpg" alt="Moto ABCD" loading="lazy">
            <img src="./images/motos/pexels-ryan-hiebendahl-94536533-9686084.jpg" alt="Moto ABCD" loading="lazy">
            <img src="./images/motos/pexels-ryan-hiebendahl-94536533-9686084.jpg" alt="Moto ABCD" loading="lazy">
        </div>
    </section>
    <section id="motos">Motos</section>
    <section id="contato">Contato</section>

</body>
</html>
